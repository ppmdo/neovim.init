set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Active Window Highlighting
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour39
set -g window-style bg=default
set -g window-active-style bg=default
set -g pane-border-format "#{R:─,#{e|/|:#{e|-|:#{pane_width},#{e|+|:#{w:#{?pane_active,🔵 ,}#P #{pane_title}},2}},2}} #{?pane_active,🔵 ,}#P #{pane_title} #{R:─,#{pane_width}}"
set -g pane-border-status top

bind-key b select-pane -P 'fg=black,bg=yellow'

# Quick Resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Save and restore sessions; Claude panes resume their own session
set -g @resurrect-dir '$HOME/.claude/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-processes 'vi vim nvim man less tail top htop "claude->~/.tmux/claude/claude-resume.sh"'
set -g @resurrect-hook-post-save-all '~/.tmux/claude/claude-save.sh'
set -g @resurrect-hook-pre-restore-all 'tmux set -g default-command ~/.tmux/claude/restore-shell.sh'
set -g @resurrect-hook-post-restore-all 'tmux set -gu default-command'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
